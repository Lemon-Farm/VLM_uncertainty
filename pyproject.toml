[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-uncertainty"
version = "0.1.0"
description = "Uncertainty estimation experiments for BLIP-family vision-language models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.30",
    "datasets>=2.19",
    "evaluate>=0.4",
    "hydra-core>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "omegaconf>=2.3",
    "pandas>=2.2",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "torchvision>=0.17",
    "tqdm>=4.66",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
